[project]
name = "csp-devsecops-support"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pip-audit>=2.10,<3",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["_work", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
