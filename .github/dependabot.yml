version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: uv
    directories:
      - /
      - /ops/devsecops
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
